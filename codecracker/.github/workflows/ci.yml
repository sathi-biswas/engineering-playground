name: CI

# Use this workflow when codecracker is the git repository root.
# In the engineering-playground monorepo, prefer the root
# `.github/workflows/ci.yml` (GitHub only loads workflows from repo root).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: pytest (ast_parser + context_builder)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run focused unit tests
        run: |
          pytest \
            tests/test_ast_parser.py \
            tests/test_context_builder.py \
            tests/test_cloner.py \
            tests/test_benchmark.py

      - name: Pipeline hygiene — import smoke check
        run: |
          python -c "from codecracker.ast_parser import parse_repository; from codecracker.context_builder import build_repo_map; print('ok')"
