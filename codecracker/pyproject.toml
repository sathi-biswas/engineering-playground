[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codecracker"
version = "0.1.0"
description = "Guided architectural walkthrough of public GitHub repos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gitpython>=3.1.40",
  "networkx>=3.2",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "pydantic>=2.6.0",
  "jinja2>=3.1.3",
  "python-dotenv>=1.0.0",
  "tiktoken>=0.7.0",
]

[project.optional-dependencies]
llm = ["openai>=1.12.0", "anthropic>=0.20.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
codecracker = "codecracker.cli:app"

[tool.setuptools.packages.find]
include = ["codecracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
